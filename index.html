<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Kadans — açık kaynak müzik çalar. Ara, keşfet, dinle." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M10 22V10h2.6v12z M15 22V8h2.6v14z M20 22v-7h2.6v7z' fill='%23E4E4E4'/%3E%3C/svg%3E" />
  <title>Kadans — Müzik Çalar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://invidious.flokinet.to" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div id="app">
    <aside class="rail" id="rail">
      <a class="wordmark" href="#" data-nav="home">
        <span class="logo" aria-hidden="true"><i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/music_note_2_24_filled.svg)"></i></span>
        <span>Kadans</span>
      </a>
      <nav class="rail-nav" aria-label="Bölümler">
        <button class="rail-link is-active" data-nav="home" aria-label="Keşfet">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/home_24_filled.svg)"></i>Keşfet
        </button>
        <button class="rail-link" data-nav="search" aria-label="Ara">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/search_24_filled.svg)"></i>Ara
        </button>
        <button class="rail-link" data-nav="likes" aria-label="Beğeniler">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/heart_24_filled.svg)"></i>Beğeniler
        </button>
      </nav>
      <div class="rail-section">
        <div class="rail-head">
          <span>Çalma listeleri</span>
          <button id="btn-new-pl" aria-label="Yeni liste oluştur">
            <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/add_24_filled.svg)"></i>
          </button>
        </div>
        <div id="pl-list" class="pl-list"></div>
      </div>
      <div class="rail-foot">
        <span class="net-dot" id="net-dot" aria-hidden="true"></span><span id="net-label">bağlanıyor…</span>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="search-wrap" id="search-wrap">
          <i class="ic search-ico" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/search_24_filled.svg)" aria-hidden="true"></i>
          <input id="search-input" type="search" placeholder="Şarkı veya sanatçı ara" aria-label="Ara" autocomplete="off" enterkeyhint="search" />
        </div>
        <a class="gh-link" href="https://github.com/Syron01/kadans" target="_blank" rel="noopener">Kaynak kod</a>
      </header>

      <section id="view-home" class="view">
        <h1 class="page-title">Bu hafta trend olanlar</h1>
        <div id="home-grid" class="grid"></div>
      </section>

      <section id="view-search" class="view" hidden>
        <h1 class="page-title" id="search-title">Sonuçlar</h1>
        <div id="search-list" class="list"></div>
      </section>

      <section id="view-likes" class="view" hidden>
        <h1 class="page-title">Beğenilen şarkılar</h1>
        <div id="likes-list" class="list"></div>
      </section>

      <section id="view-playlist" class="view" hidden>
        <h1 class="page-title" id="pl-title"></h1>
        <div id="pl-songs" class="list"></div>
      </section>
    </main>
  </div>

  <footer class="player" id="player">
    <div class="player-main">
      <img id="np-art" class="np-art" alt="" hidden />
      <div class="np-art np-art--ph" id="np-art-ph" aria-hidden="true">
        <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/music_note_2_24_filled.svg)"></i>
      </div>
      <div class="np-meta">
        <span class="np-title" id="np-title">Bir şey çalmıyor</span>
        <span class="np-artist" id="np-artist">Kadans</span>
      </div>
      <button class="icon-btn like-btn" id="btn-like" title="Beğen" aria-label="Beğen" hidden>
        <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/heart_24_filled.svg)"></i>
      </button>
    </div>
    <div class="player-center">
      <div class="controls">
        <button class="icon-btn" id="btn-shuffle" title="Karıştır" aria-label="Karıştır" aria-pressed="false">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/arrow_shuffle_24_filled.svg)"></i>
        </button>
        <button class="icon-btn" id="btn-prev" title="Önceki" aria-label="Önceki">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/previous_24_filled.svg)"></i>
        </button>
        <button class="play-btn" id="btn-play" title="Oynat veya duraklat" aria-label="Oynat veya duraklat">
          <i class="ic ic-play" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/play_24_filled.svg)"></i>
          <i class="ic ic-pause" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/pause_24_filled.svg)" hidden></i>
        </button>
        <button class="icon-btn" id="btn-next" title="Sonraki" aria-label="Sonraki">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/next_24_filled.svg)"></i>
        </button>
        <button class="icon-btn" id="btn-repeat" title="Tekrar" aria-label="Tekrar" aria-pressed="false">
          <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/arrow_repeat_all_24_filled.svg)"></i>
        </button>
      </div>
      <div class="seek-row">
        <span class="time" id="t-cur">0:00</span>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Konum" />
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button class="icon-btn" id="btn-queue" title="Sıra" aria-label="Sıra" aria-expanded="false" aria-controls="queue-drawer">
        <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/text_bullet_list_ltr_24_filled.svg)"></i>
      </button>
      <i class="ic vol-ico" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/speaker_2_24_filled.svg)" aria-hidden="true"></i>
      <input class="vol" id="vol" type="range" min="0" max="100" value="90" aria-label="Ses" />
    </div>
  </footer>

  <div class="queue-drawer" id="queue-drawer" hidden>
    <div class="queue-head">
      <span>Sıra</span>
      <button class="icon-btn" id="btn-queue-close" title="Kapat" aria-label="Kapat">
        <i class="ic" style="--m:url(https://unpkg.com/@fluentui/svg-icons@1.1.260/icons/dismiss_24_filled.svg)"></i>
      </button>
    </div>
    <div id="queue-list" class="queue-list"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js?v=10"></script>
</body>
</html>
